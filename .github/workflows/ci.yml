name: tests

on: [push, pull_request]

permissions:
  contents: write  # only used to push the screenshots branch

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 = macOS's built-in python3; 3.11 = Raspberry Pi OS (Bookworm); 3.13 = current
        python-version: ["3.9", "3.11", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pygame numpy pillow pytest pyflakes "tomli; python_version < '3.11'"
      - run: python -m pyflakes pokedex scripts tests  # undefined names, unused imports
      - run: pytest -q
      - run: python -m pokedex --camera folder --no-tts --frames 30
      - run: python scripts/screenshots.py
        if: matrix.python-version == '3.13'
      - name: Publish screenshots to the screenshots branch
        if: matrix.python-version == '3.13' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd screenshots
          git init -q -b screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
