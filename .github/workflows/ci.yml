name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pygame numpy pillow pytest
      - run: pytest -q
      - run: python -m pokedex --camera folder --no-tts --frames 30
